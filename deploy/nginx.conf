# /etc/nginx/sites-available/telesync
# Listens on localhost only; exposed to your tailnet with `tailscale serve`.

# `tailscale serve` terminates HTTPS and forwards plain HTTP; keep its scheme so the
# app marks the session cookie Secure.
map $http_x_forwarded_proto $telesync_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root /opt/tele-sync/frontend/dist;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $telesync_proto;
        proxy_read_timeout 300s;   # ?refresh=true dialog listing can be slow
    }

    # Local media: voice, stickers, documents, avatars (and photos/videos without Google Photos).
    # Session check for /files/ (login required, same cookie as the API).
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /files/ {
        auth_request /_auth;
        alias /var/lib/tele-sync/files/;
        autoindex off;
        add_header Cache-Control "private, max-age=2592000" always;
        # Received files are untrusted: never let an HTML/SVG file run as this origin.
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
            audio/ogg ogg oga opus;
            audio/mpeg mp3;
            audio/mp4 m4a;
            application/pdf pdf;
            application/x-tgsticker tgs;
        }
        default_type application/octet-stream;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
