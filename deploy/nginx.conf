# /etc/nginx/sites-available/telesync
# Listens on localhost only; exposed to your tailnet with `tailscale serve`.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root /opt/tele-sync/frontend/dist;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # ?refresh=true dialog listing can be slow
    }

    # Local media: voice, stickers, documents, avatars (and photos/videos without Google Photos).
    location /files/ {
        alias /var/lib/tele-sync/files/;
        autoindex off;
        expires 30d;
        # Received files are untrusted: never let an HTML/SVG file run as this origin.
        add_header Content-Security-Policy "sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
            audio/ogg ogg oga opus;
            audio/mpeg mp3;
            audio/mp4 m4a;
            application/pdf pdf;
            application/x-tgsticker tgs;
        }
        default_type application/octet-stream;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
