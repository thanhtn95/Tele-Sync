# /etc/postgresql/16/main/conf.d/telesync.conf
# Small-footprint settings for an e2-micro (1 GB RAM, standard persistent disk).
listen_addresses = 'localhost'
max_connections = 20
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB
checkpoint_completion_target = 0.9
max_wal_size = 512MB
min_wal_size = 64MB
random_page_cost = 4.0        # pd-standard is HDD-backed
effective_io_concurrency = 2
max_worker_processes = 2
max_parallel_workers = 1
max_parallel_workers_per_gather = 0
